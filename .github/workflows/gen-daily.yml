# Pipeline PRIMARIO del view diario: GENERA y luego ENVÍA, en cadena.
# Vive en GitHub Actions porque la generación bilingüe (~4200 tokens de Claude
# ≈ 55-85s) NO cabe en el límite de 60s de Vercel Hobby — causa raíz de los
# fallos del 3 y 6 de julio 2026. Encadenar gen→send mantiene los datos
# frescos: el correo sale ~2-4 min después de cotizar (no 30 min después).
#
# Cadena completa de respaldos (cualquier eslabón que falle, el siguiente
# recoge; el marcador sent/<fecha>.json evita duplicados):
#   6:52  Actions: gen → push → send   (primario, correo ~6:56-6:58)
#   7:00  cronjob.org: send-daily?resend=1  (si Actions falló: inline-gen+defer)
#   7:10  Vercel cron: send-daily?resend=1  (último respaldo, lag Hobby ~1h)
# Si este workflow falla, GitHub manda correo automático al dueño del repo.
name: gen-daily

on:
  schedule:
    # El DISPARO PRIMARIO ya no es este cron: es cronjob.org 6:50 →
    # /api/trigger-gen → workflow_dispatch (el scheduler interno de Actions
    # demostró ser flaky: el 2026-07-07 simplemente no corrió). Estos crons
    # quedan de RESPALDO, en dos horarios por redundancia — todo es
    # idempotente vía content/<slug>.md y sent/<slug>.json.
    - cron: "52 12 * * 1-5"
    - cron: "5 13 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = generar sin escribir, sin commitear y SIN enviar (prueba)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: gen-daily
  cancel-in-progress: false

jobs:
  gen-and-send:
    runs-on: ubuntu-latest
    # 15 min: el camino claude -p puede tardar un poco más que el SDK
    # (búsquedas del pulso + redactor secuenciales dentro del CLI).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci --omit=dev --ignore-scripts

      # Claude Code CLI: la generación consume la suscripción Max vía
      # CLAUDE_CODE_OAUTH_TOKEN ($0 extra de API). ANTHROPIC_API_KEY queda
      # solo como respaldo si el CLI falla (token vencido, límite del plan).
      - name: Instalar Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Generar view del día (datos en vivo + Claude, sin límite de tiempo)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: node scripts/gen-daily-action.mjs

      - name: Commit y push (dispara redeploy de Vercel)
        if: ${{ (github.event.inputs.dry_run || '0') != '1' }}
        run: |
          git config user.name "riskon-bot"
          git config user.email "view@riskon.lat"
          git add content/
          if git diff --cached --quiet; then
            echo "Nada nuevo que commitear (view ya existía o fin de semana)."
          else
            git commit -m "auto: pre-market view $(TZ=America/Mexico_City date +%F) [actions]"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Enviar el correo (send-daily lee el content vía contents API)
        if: ${{ (github.event.inputs.dry_run || '0') != '1' }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # El guard sent/<fecha>.json hace esto idempotente: si ya se envió
          # (p.ej. reintento del workflow), responde "already sent today".
          code=$(curl -s -o /tmp/send.json -w "%{http_code}" -X POST \
            "https://riskon.lat/api/send-daily?resend=1" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          cat /tmp/send.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::send-daily respondió HTTP $code"
            exit 1
          fi

      # Post diario en X (@riskonlat), compuesto del front-matter del view
      # (sin IA, $0). continue-on-error: si X falla, el correo ya salió y el
      # run queda verde — el script loggea el motivo. Si los secrets de X no
      # existen aún, el script sale en 0 con aviso.
      - name: Publicar en X (@riskonlat)
        if: ${{ (github.event.inputs.dry_run || '0') != '1' }}
        continue-on-error: true
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/post-x-action.mjs
