name: Daily content draft

on:
  schedule:
    # 13:00 UTC = 7:00am Ciudad de México (UTC-6 fijo desde 2022)
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate today's draft
        run: node scripts/generate-daily.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "risk-on-bot"
          git config user.email "actions@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "Daily draft $(date -u +%F)"
            git push
          fi
